name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --child-concurrency=1
      - name: Validate contracts
        run: |
          pnpm --filter @aula-rayen/contracts typecheck
          pnpm --filter @aula-rayen/contracts test:run
          pnpm --filter @aula-rayen/contracts build

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --child-concurrency=1
      - name: Validate API
        run: |
          pnpm --filter @aula-rayen/contracts build
          pnpm --filter @aula-rayen/api exec eslint src test
          pnpm --filter @aula-rayen/api test
          pnpm --filter @aula-rayen/api typecheck
          pnpm --filter @aula-rayen/api build

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_PUBLIC_API_URL: http://127.0.0.1:3999
      VITE_PUBLIC_AUTH_URL: http://127.0.0.1:3999/auth
      VITE_PUBLIC_SITE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --child-concurrency=1
      - name: Validate web
        run: |
          pnpm --filter @aula-rayen/contracts build
          pnpm --filter @aula-rayen/web lint
          pnpm --filter @aula-rayen/web typecheck
          pnpm --filter @aula-rayen/web test:run
          pnpm --filter @aula-rayen/web build
          pnpm --filter @aula-rayen/web check:landing
