name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/contracts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --child-concurrency=1
      - name: Run web tests
        env:
          VITE_PUBLIC_API_URL: http://127.0.0.1:3999
          VITE_PUBLIC_AUTH_URL: http://127.0.0.1:3999/auth
          VITE_PUBLIC_SITE_URL: http://127.0.0.1:3001
        run: pnpm --filter @aula-rayen/web test:run

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Check out application
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_PUBLIC_API_URL: ${{ secrets.VITE_PUBLIC_API_URL }}
          VITE_PUBLIC_AUTH_URL: ${{ secrets.VITE_PUBLIC_AUTH_URL }}
          VITE_PUBLIC_SITE_URL: ${{ secrets.VITE_PUBLIC_SITE_URL }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$VITE_PUBLIC_API_URL"
          test -n "$VITE_PUBLIC_AUTH_URL"
          test -n "$VITE_PUBLIC_SITE_URL"

      - name: Install pnpm
        run: npm install --global pnpm@10.33.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --child-concurrency=1

      - name: Validate web
        env:
          VITE_PUBLIC_API_URL: ${{ secrets.VITE_PUBLIC_API_URL }}
          VITE_PUBLIC_AUTH_URL: ${{ secrets.VITE_PUBLIC_AUTH_URL }}
          VITE_PUBLIC_SITE_URL: ${{ secrets.VITE_PUBLIC_SITE_URL }}
        run: |
          pnpm --filter @aula-rayen/contracts build
          pnpm --filter @aula-rayen/web lint
          pnpm --filter @aula-rayen/web typecheck
          pnpm --filter @aula-rayen/web test:run
          pnpm --filter @aula-rayen/web build
          pnpm --filter @aula-rayen/web check:landing

      - name: Deploy web to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_PUBLIC_API_URL: ${{ secrets.VITE_PUBLIC_API_URL }}
          VITE_PUBLIC_AUTH_URL: ${{ secrets.VITE_PUBLIC_AUTH_URL }}
          VITE_PUBLIC_SITE_URL: ${{ secrets.VITE_PUBLIC_SITE_URL }}
        run: pnpm --dir apps/web exec wrangler deploy
