services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - ./apps/api/.env
    environment:
      PORT: "3000"
      BETTER_AUTH_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:3001
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      VITE_PUBLIC_API_URL: http://localhost:3000
      INTERNAL_API_URL: http://api:3000
      WATCHPACK_POLLING: "true"
    ports:
      - "3001:3001"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
